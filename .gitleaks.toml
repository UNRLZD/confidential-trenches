# gitleaks: the default rules, plus the money keys this repo's chains use that the defaults do not name.
title = "confidential-trenches"

[extend]
useDefault = true

# A NEAR secret key: "ed25519:" and the base58 of 64 bytes (86-88 chars). A public key is 32 bytes (43-44 chars),
# so public keys never match.
[[rules]]
id = "near-ed25519-secret-key"
description = "NEAR ed25519 secret key"
regex = '''ed25519:[1-9A-HJ-NP-Za-km-z]{86,88}\b'''
keywords = ["ed25519:"]
# A 64-byte ed25519 signature has the same shape. 1Click signs its quotes so; the kit's tests keep real signed quotes
# as fixtures (card wallet-1click-check). Only a "signature" field in a JSON fixture under packages/kit/test/fixtures/
# passes, alone on its line as JSON.stringify(_, null, 2) writes it; the same value under any other key, as a bare
# string, beside another field on one line, or in any other file is still found
# (scripts/ci/gitleaks-config.test.mjs).
[[rules.allowlists]]
description = "a signature field in a test fixture: an ed25519 signature is 64 bytes too, never a key"
condition = "AND"
paths = ['''^packages/kit/test/fixtures/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"signature"\s*:\s*"ed25519:[1-9A-HJ-NP-Za-km-z]{86,88}",?\s*$''']

# A machine's name on a tailnet (Tailscale MagicDNS): labels, then the tailnet suffix, in any case. No such name is ever
# committed here, made-up ones included.
[[rules]]
id = "tailnet-host"
description = "Tailscale machine or tailnet name"
regex = '''(?i)\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.ts\.net\b'''
keywords = [".ts.net"]

# Circle's native USDC on NEAR mainnet is a public account id (packages/kit/src/vault/shapes.ts VAULT_CONSTANTS.TOKEN,
# read on chain). Its source line carries gitleaks:allow, but a bundle that compiles it (SIGN_HOST's public/app.js)
# drops the comment and keeps `TOKEN:` beside it, which the default generic-api-key rule reads as a key. Only that exact
# value passes, and only for that rule; another value under a token-like name, or this one with a character more, is
# still found (scripts/ci/gitleaks-config.test.mjs).
[[allowlists]]
description = "Circle's native USDC account id on NEAR mainnet, a public value"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1$''']
