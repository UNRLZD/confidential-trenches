# SPDX-License-Identifier: Apache-2.0
# The Blindfill vault: a NEAR port of Privacy Pools v1.3.0 core (0xbow, Apache-2.0). No access key, no owner, no
# upgrade path, no pause, no setter.
[package]
name = "blindfill-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
# NEP-330: the wasm's contract_source_metadata links here, and its build_info names this repository at the commit built
repository = "https://github.com/UNRLZD/confidential-trenches"

# The reproducible build (vault.md 2.8, NEP-330): `cargo near build reproducible-wasm` runs container_build_command in
# this image, which is named by its digest, so every machine builds the same bytes from the same commit.
# The image is cargo-near 0.22.0's own pin for a new project (`cargo near new`): cargo-near 0.21.1 on rustc 1.96.0, the
# toolchain the vault is held to. The tag is read by people only; Docker pulls the digest. scripts/deploy.mjs holds the
# same image, digest and commands (REPRODUCIBLE) and refuses a build when this table differs from them.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
# the mainnet build; --no-embed-abi keeps the ABI export out (vault.md 2.5.7 lists every export)
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-embed-abi"]

# the testnet build (`--variant testnet`): the same image and flags with feature testnet
[package.metadata.near.reproducible_build.variant.testnet]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-embed-abi", "--features", "testnet"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The testnet build: TOKEN names the team's testnet USDC (deployments/testnet-usdc.json). Every other byte of behaviour
# is the mainnet build's.
testnet = []
# VT-S17's test build only (tests/s17.rs): `on_payout` logs src/payout.rs OUT_OF_GAS_BUILD_MARK, then runs out of gas.
# tests/harness/run.sh builds it apart, as VAULT_OOG_WASM. It must never ship: scripts/deploy.mjs refuses any wasm
# holding the mark (scripts/live-checks/vault-skeleton.mjs wasmProblems.testBuild) and the vault's live check fails it.
test-on-payout-out-of-gas = []
# The near-sandbox suite (tests/harness, VT-S*): its tests are `[[test]]` targets that need this feature, so a plain
# `cargo test` (CI) neither builds nor runs them, and nothing here reaches the wasm build. Run through
# tests/harness/run.sh.
sandbox = ["dep:near-workspaces", "dep:tokio", "dep:reqwest", "dep:openssl", "dep:near-primitives", "dep:near-crypto"]

[dependencies]
# near-sdk 5.29.1 without default features (no wee_alloc), as the vault's gas proof built it. `legacy` gives the plain
# `collections`, which write at once, so env::storage_usage() sees every byte a call writes (vault.md 2.3).
near-sdk = { version = "=5.29.1", default-features = false, features = ["legacy"] }
# The trim build of light-poseidon (src/poseidon.rs; vault.md 2.6): its `Poseidon` with circomlib's t = 3 and t = 4 constants
# as data, never `new_circom`. ark-bn254 and ark-ff are the versions light-poseidon 0.4.1 itself requires.
light-poseidon = "=0.4.1"
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
# The sandbox suite only (feature `sandbox`; optional, so the vault's own build never links them):
# near-workspaces 0.23.0 starts near-sandbox (its near-sandbox 0.3.16 defaults to 2.13.4; the harness also names it),
# deploys, sends batches and patches the token's code in; the versions the research gas proof ran
# (proofs/g1-vault-gas/sandbox/Cargo.lock at research main ffcba5e).
near-workspaces = { version = "=0.23.0", optional = true }
# near-workspaces' async runtime, for #[tokio::test].
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"], optional = true }
# the HTTP client near-workspaces already uses (via near-jsonrpc-client 0.22.0): the harness reads
# EXPERIMENTAL_tx_status, which near-workspaces does not expose, to name each receipt's method for the gas table.
reqwest = { version = "=0.12.28", optional = true }
# NEP-366: U's own call as a signed `DelegateAction` that a relayer account sends (VT-S02, tests/s02.rs), which
# near-workspaces cannot build. The versions near-workspaces 0.23.0 already links, as the research gas proof named them
# (proofs/g1-vault-gas/sandbox/Cargo.toml at research main ffcba5e).
near-primitives = { version = "=0.37.4", optional = true }
near-crypto = { version = "=0.37.4", optional = true }

# near-jsonrpc-client takes native-tls, which on Linux links OpenSSL; a Linux host may have no OpenSSL headers, so
# OpenSSL is built from source there (needs perl and make), as in the research gas proof.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "=0.10.81", features = ["vendored"], optional = true }

[dev-dependencies]
near-sdk = { version = "=5.29.1", default-features = false, features = ["legacy", "unit-testing"] }

# the near-sandbox tests: skipped unless `--features sandbox`
[[test]]
name = "smoke"
path = "tests/smoke.rs"
required-features = ["sandbox"]

[[test]]
name = "relayer_send"
path = "tests/relayer_send.rs"
required-features = ["sandbox"]

[[test]]
name = "relayer_withdraw"
path = "tests/relayer_withdraw.rs"
required-features = ["sandbox"]

# Tests only (`cargo test` builds the dev profile): Poseidon's field arithmetic at full optimisation, so VT-P01
# (tests/tree_prop.rs, 125,774 inserts) takes 16 s instead of 140 s on the box (card vault-leanimt). light-poseidon's
# `Poseidon<Fr>` and ark-ff's Montgomery ops are generic, so their code is made in the crate that names `Fr`, this one:
# the dependencies alone took it only to 113 s. Overflow checks and debug assertions stay on (they are separate
# settings); the wasm build is the release profile below, which this does not touch.
[profile.dev.package.blindfill-vault]
opt-level = 3
[profile.dev.package.light-poseidon]
opt-level = 3
[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-bn254]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-std]
opt-level = 3
[profile.dev.package.ark-serialize]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

# its own workspace: the vault builds alone, never with the JS workspace
[workspace]
