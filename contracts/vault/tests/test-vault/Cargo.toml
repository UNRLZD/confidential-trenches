# SPDX-License-Identifier: Apache-2.0
# A test-only contract with the vault's deposit surface (storage_prepay, ft_on_transfer, the deposits and tree views),
# for the deposit relayer's near-sandbox proof (tests/relayer_send.rs) until card vault-deposit-insert lands. It is
# deployed only into a local near-sandbox; never on a network.
[package]
name = "blindfill-test-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The vault's own near-sdk, as tests/mock-token pins it (no wee_alloc; `legacy` for the plain collections).
near-sdk = { version = "=5.29.1", default-features = false, features = ["legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

# its own workspace: built alone by tests/harness/run.sh
[workspace]
