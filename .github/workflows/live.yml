# The live checks and the browser runs, on GitHub's own runners (card ci-live-runners). A public repository's standard
# runners cost nothing and start in seconds, so no deploy waits on a queue another product holds.
#
#   gh workflow run live.yml -f host=app|sign|helper -f commit=<the deployed commit> [-f network=testnet]
#   gh run watch --exit-status
#
# which each deploy script prints once it has deployed. The plan job reads the checks to run from the deploy
# (scripts/ci/live-plan.mjs: LIVE_CHECKS and liveRuns of apps/terminal/scripts/deploy.mjs, packages/signpage/scripts/deploy.mjs
# and scripts/ci/helper-live-checks.mjs), never a copy. Each run of each check is its own job, in parallel (except a
# serial group, below): the job
# checks out the deployed commit, starts Chrome through scripts/browsers.mjs (and installs Playwright's Firefox and WebKit
# where the run names them), runs the check, and uploads its full output and its screenshots. The run fails on any FAIL
# or error. The helper's commit is held to what the helper reports (X-Helper-Commit). APP_HOST and SIGN_HOST report none:
# signpage-release holds their files to the commit's own build, and fails when a host serves another commit's.
#
# A serial group (card helper-live-jup-serial; SERIAL_GROUPS in scripts/ci/helper-live-checks.mjs) is ONE job: its checks
# spend one shared budget, the helper's Jupiter window, so they run one after another (scripts/ci/live-serial.mjs), each
# once the helper's own answer says the budget is idle (scripts/ci/jup-idle.mjs), and none is retried. Run in parallel they
# spent it between them and a page fell back to chain reads (run 42332950254 attempt 1), a red that was no fault of the code.
#
# The workflow reads no secret and holds the read-only token alone. A check that needs one (helper-proxy reads the vendor
# keys the host holds) is not run: the plan lists it as skipped-needs-secret in the run's summary, which is no pass.
#
# On a pull request one job runs the terminal's browser chain and the signing page's browser runs.
# Every action is pinned by commit sha, each read from its own repo: actions/checkout v7.0.1, actions/setup-node v7.1.0 and
# pnpm/action-setup v6.1.0 as ci.yml has them, actions/upload-artifact v7.0.2 read from its repo on 2026-11-03 at 14:55Z,
# actions/cache/restore and actions/cache/save v6.1.0 as ci.yml has them.
name: live

on:
  workflow_dispatch:
    inputs:
      host:
        description: the deployed host whose checks run
        required: true
        type: choice
        options: [app, sign, helper]
      commit:
        description: the deployed commit (40 hex characters)
        required: true
        type: string
      network:
        description: the network the app's build names (app only; the deploy prints it when it is testnet)
        required: false
        default: mainnet
        type: choice
        options: [mainnet, testnet]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One queue per host (card live-runs-one-per-host): a second dispatched run on a host waits until the first ends, so no
# check is judged against another run's load on the host's shared budgets (6 Nov 10:55Z: two helper runs at once, 42206377652
# and 42206382978, read helper-token-page-cold 29 and 28 of 32 cold, floor 30; alone, 42207995804, 31). GitHub keeps one
# run waiting per group: a newer dispatch on the host replaces a waiting one, never the one running. A pull request's run
# is its own group (its ref) and a newer push cancels it.
concurrency:
  group: live-${{ inputs.host || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: the checks this deploy prints, and the commit the host reports
        id: plan
        env:
          HOST: ${{ inputs.host }}
          COMMIT: ${{ inputs.commit }}
          NETWORK: ${{ inputs.network || 'mainnet' }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT" || { echo "the checkout is not $COMMIT"; exit 1; }
          node scripts/ci/live-plan.mjs "$HOST" "$COMMIT" --network "$NETWORK" --verify

  check:
    needs: plan
    if: needs.plan.outputs.count != '' && needs.plan.outputs.count != '0'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # a serial group runs its checks one after another (about 11 minutes of checks, and the waits for an idle budget)
    timeout-minutes: ${{ matrix.group != '' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Google Chrome stable, and its sandbox comes up
        if: matrix.chrome
        uses: ./.github/actions/chrome
      # Playwright's Firefox and WebKit have no installed channel: the launcher (scripts/browsers.mjs) starts these builds.
      # They and the system packages they need come from the cache (card ci-cargo-near-cached: run 42044118472's
      # `playwright install --with-deps` crawled at kB/s from the image's Ubuntu mirror for 20 min and no check started).
      # The key names the Playwright release, the engines and the runner image (ImageOS, ImageVersion), since the .debs
      # are the ones that image lacked: a hit installs them with dpkg and no request, then `install-deps --dry-run`
      # (apt-get -s on the image's own lists, offline) must find none missing. A miss, or a hit that fails either, runs
      # Playwright's own install, bounded in time and tried once more on another mirror, apt keeping each .deb it
      # fetches for the save.
      - name: the cache key of Playwright's engines on this runner image
        id: engines-key
        if: matrix.engines != ''
        env:
          ENGINES: ${{ matrix.engines }}
        run: |
          version="$(pnpm --filter terminal exec playwright --version | awk '{ print $2 }')"
          echo "key=playwright-$version-${ENGINES// /-}-${ImageOS:-unknown}-${ImageVersion:-unknown}" | tee -a "$GITHUB_OUTPUT"
      - id: engines
        if: matrix.engines != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.engines-key.outputs.key }}
      - name: Playwright's Firefox and WebKit
        if: matrix.engines != ''
        env:
          ENGINES: ${{ matrix.engines }}
          HIT: ${{ steps.engines.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/playwright-debs"
          started=$SECONDS
          shopt -s nullglob
          cached=("$debs"/*.deb)
          # the log is the runner's own file, written by the shell, not by sudo
          # shellcheck disable=SC2086,SC2024
          if [ "$HIT" = true ] && { [ "${#cached[@]}" = 0 ] || sudo DEBIAN_FRONTEND=noninteractive dpkg -i "${cached[@]}" > "$RUNNER_TEMP/dpkg.log" 2>&1; } \
            && pnpm --filter terminal exec playwright install-deps --dry-run $ENGINES; then
            echo "the system packages from the cache: ${#cached[@]} .deb, none missing"
          else
            if [ "$HIT" = true ]; then echo "::warning::the cached .debs did not install or left a package missing: Playwright's own install runs"; cat "$RUNNER_TEMP/dpkg.log" 2>/dev/null || true; fi
            sudo rm -rf "$debs"
            mkdir -p "$debs/partial"
            printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\nAcquire::Retries "5";\n' "$debs" | sudo tee /etc/apt/apt.conf.d/90playwright-debs
            # Bounded: a normal install takes 15-17 s (run 42059594658's Firefox jobs); 180 s is a crawling mirror, as
            # job 127357435385's azure.archive.ubuntu.com was (19.5 min to the job's limit). Then once more, on fresh
            # connections, from Ubuntu's own archive.ubuntu.com and security.ubuntu.com: the image's apt reads its
            # mirrors from /etc/apt/apt-mirrors.txt (mirror+file, Azure's first; actions/runner-images
            # configure-apt-sources.sh), and a slow mirror is no failed one, so apt never moves on by itself.
            # shellcheck disable=SC2086
            deps() { timeout -k 10 180 pnpm --filter terminal exec playwright install --with-deps $ENGINES; }
            if ! deps; then
              echo "::warning::Playwright's install did not finish in 180 s: once more, from archive.ubuntu.com and security.ubuntu.com"
              sudo pkill -TERM -x apt-get || true
              sleep 2
              sudo pkill -KILL -x apt-get || true
              sudo dpkg --configure -a || true
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
              deps
            fi
            sudo rm -f /etc/apt/apt.conf.d/90playwright-debs
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$(id -u):$(id -g)" "$debs"
          fi
          # the engines themselves: nothing to fetch when the cache held them
          # shellcheck disable=SC2086
          pnpm --filter terminal exec playwright install $ENGINES
          echo "browser setup took $((SECONDS - started)) s"
      - if: matrix.engines != '' && steps.engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.engines-key.outputs.key }}
      # TMPDIR is the folder the artifact takes: a check keeps its screenshots under the temporary folder by default
      - name: ${{ matrix.name }}
        if: matrix.group == ''
        env:
          KEY: ${{ matrix.key }}
          ARGS: ${{ matrix.args }}
          ID: ${{ matrix.id }}
        run: |
          out="$RUNNER_TEMP/live"
          mkdir -p "$out"
          export TMPDIR="$out"
          set -o pipefail
          # shellcheck disable=SC2086
          node "scripts/live-checks/$KEY.mjs" $ARGS 2>&1 | tee "$out/$ID.log"
      # a serial group: its checks one after another, each once the helper's Jupiter budget is idle, none retried
      - name: ${{ matrix.name }} (in turn)
        if: matrix.group != ''
        env:
          GROUP: ${{ matrix.group }}
          ID: ${{ matrix.id }}
        run: |
          out="$RUNNER_TEMP/live"
          mkdir -p "$out"
          export TMPDIR="$out"
          set -o pipefail
          # shellcheck disable=SC2086
          node scripts/ci/live-serial.mjs $GROUP 2>&1 | tee "$out/$ID.log"
      - name: the lines that matter, in the run's summary
        if: always()
        env:
          NAME: ${{ matrix.name }}
          ID: ${{ matrix.id }}
        run: |
          log="$RUNNER_TEMP/live/$ID.log"
          {
            echo "### $NAME"
            echo '```'
            if [ -e "$log" ]; then grep -E '^(BAD|WARN)|PASS|FAIL|INCONCLUSIVE|ERROR|[Ee]rror' "$log" | head -200; else echo "no output: the check did not start"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/live/*.log
            ${{ runner.temp }}/live/**/*.png
          if-no-files-found: warn
          retention-days: 14

  # The one status to read, and to require: green only when the plan and every check job passed. A skipped check is
  # listed with its reason, never counted as a pass.
  live:
    needs: [plan, check]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every check passed, and what was not run
        env:
          PLAN: ${{ needs.plan.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          CHECKS: ${{ needs.check.result }}
          SKIPPED: ${{ needs.plan.outputs.skipped }}
        run: |
          if [ -n "$SKIPPED" ] && [ "$SKIPPED" != "[]" ]; then
            echo "$SKIPPED" | jq -r '.[] | "skipped-\(.reason): \(.key) (\(.detail))"' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PLAN" != success ]; then echo "the plan job ended $PLAN"; exit 1; fi
          if [ -z "$COUNT" ] || [ "$COUNT" = 0 ]; then echo "the plan lists no check to run"; exit 1; fi
          if [ "$CHECKS" != success ]; then echo "a check job ended $CHECKS"; exit 1; fi
          echo "all $COUNT live runs passed"

  # The terminal's browser chain and the signing page's browser runs, on every pull request, in parallel with ci.yml's jobs.
  browser-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Google Chrome stable, and its sandbox comes up
        uses: ./.github/actions/chrome
      - name: the terminal's browser chain (in-shell, BAR-10 and every screen)
        run: pnpm --filter terminal run test:e2e
      - name: the signing page in headless Chrome (its headers, its frame)
        run: pnpm --filter signpage run test:e2e
      - name: the signing page's withdraw form at 390 and 1440 wide
        run: node packages/signpage/test/withdraw-screens/run.mjs
