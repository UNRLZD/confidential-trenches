# CI needs no secret and no token beyond the read-only one GitHub gives every run.
# Every action is pinned by commit sha, each read from its own repo on 2026-10-26 at 11:24Z:
#   actions/checkout v7.0.1, actions/setup-node v7.1.0, pnpm/action-setup v6.1.0;
#   actions/cache v6.1.0 read from its repo on 2026-11-02 at 12:40Z, its restore/ and save/ actions (the same commit)
#   on 2026-11-05 at 15:05Z;
#   Swatinem/rust-cache v2.9.3 (d1527c8, released 2026-10-20) and actions/download-artifact v8.0.2 (9000827, released
#   2026-10-07) read from their repos on 2026-11-04 at 07:20Z.
# Foundry v1.7.1 is no action but its release file, foundry_v1.7.1_linux_amd64.tar.gz (asset 415095756 of
# foundry-rs/foundry, 98,596,412 bytes), sha256 cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b:
# the asset's digest field on GitHub's API read on 2026-11-08 at 09:34Z, and a local sha256 of its bytes agrees.
# The five job ids are the required checks of main's ruleset: gitleaks, deep-import, verify-gate, money-gate, test.
# The sixth, vault-sandbox, and the seventh, pool-solana, join them when the owner adds them to the ruleset. The
# eighth, slither, is advisory and stays out of it.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # nightly on main: the vault's sandbox suite only (every other job skips a scheduled run)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request cancels its older run; every run on main finishes (the money re-read included)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks 8.30.1, the binary checked against the sha256 in its release's checksums file (read 2026-10-26 11:25Z),
      # from the cache when it holds it (scripts/ci/fetch.sh checks the sha256 after the restore and after a fetch)
      - id: gitleaks-tgz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/gitleaks-8.30.1.tgz
          key: download-gitleaks-8.30.1-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - name: install gitleaks
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/gitleaks-8.30.1.tgz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf ~/.cache/ci-downloads/gitleaks-8.30.1.tgz -C "$RUNNER_TEMP" gitleaks
      - if: steps.gitleaks-tgz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/gitleaks-8.30.1.tgz
          key: download-gitleaks-8.30.1-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # Main's rules judge every run: .gitleaks.toml and .gitleaksignore come from origin/main (the checkout above
      # fetches every branch), never the checkout's own copies, so no pull request can pass its own secret. gitleaks
      # also reads the scanned folder's own .gitleaksignore whatever -i names, so main's copy is written over it.
      # A new ignore line or rule lands in its own pull request first, apart from the commit it covers: that pull
      # request's scan uses main's rules too, so it passes only without its new entry; once it is on main, the covered
      # branch's next run reads it. The history is HEAD's ancestry only (--log-opts), never every fetched branch, so one
      # branch's history never fails another's: on a pull request HEAD is GitHub's merge commit, so its own commits and
      # main's are read; on main, main's whole history. Every commit that reaches main is in a run's HEAD ancestry.
      # scripts/ci/gitleaks-scope.test.mjs replays this step on planted repos.
      - name: scan the tree and the history with main's rules
        run: |
          mkdir -p "$RUNNER_TEMP/rules"
          git show origin/main:.gitleaks.toml > "$RUNNER_TEMP/rules/.gitleaks.toml"
          : > "$RUNNER_TEMP/rules/.gitleaksignore"
          if git cat-file -e origin/main:.gitleaksignore; then
            git show origin/main:.gitleaksignore > "$RUNNER_TEMP/rules/.gitleaksignore"
          fi
          cp "$RUNNER_TEMP/rules/.gitleaksignore" .gitleaksignore
          "$RUNNER_TEMP/gitleaks" dir . --config "$RUNNER_TEMP/rules/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/rules/.gitleaksignore" --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--full-history HEAD" --config "$RUNNER_TEMP/rules/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/rules/.gitleaksignore" --redact --no-banner
      # Every CI gate's own tests, scripts/ci/*.test.mjs, in one step: a gate test added later runs without a new line.
      # This job has what all of them need: gitleaks for gitleaks-config.test.mjs, the full history, and the
      # install for deep-import.test.mjs. scripts/ci/tests-run.test.mjs fails on a tracked test file no command runs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: every gate refuses its planted cases
        run: GITLEAKS="$RUNNER_TEMP/gitleaks" pnpm run test:gates

  # 15 minutes: the quote-speed step's two tries, each killed at 300 s (quote-speed.mjs TRY_MS; evm-quote-warm-round's
  # own runner jobs took 98 to 128 s with setup, live runs 42500836732 to 42522703562), so at most 10 minutes, on top
  # of the 17 s the rest of the job takes (run 42532277117), with the rest as margin for the install and the clone.
  deep-import:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # the full history: the quote-speed step reads the change base..head and the base's scripts/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: the terminal reaches Blindfill only through the kit's public entry
        run: pnpm run check:imports
      - name: the performance table's own tests
        run: node --test scripts/perf-table.test.mjs
      - name: the README and docs/performance.md match the run records
        run: node scripts/perf-table.mjs --check
      # Card quote-speed-before-merge: a change to the EVM quote's code (scripts/ci/quote-speed.mjs PATHS) runs the live
      # check evm-quote-warm-round on this runner against this checkout's kit, and is refused when its warm p95 misses a
      # second on two tries (public RPCs are noisy, so one rerun); a run that writes no record is refused. On a pull
      # request the gate and the check run as main has them, from the base's whole scripts/ tree (see verify-gate), and
      # measure the checkout's kit; scripts/ci/quote-speed.test.mjs and base-gate.test.mjs replay these lines. While main
      # has no copy of the gate, this pull request's own copy decides on the same change; that line goes once main has
      # the gate. The shell is bash with pipefail, so a failed git archive stops the step instead of falling through to
      # the pull request's own copy.
      - name: a change to the EVM quote keeps its warm p95 under a second (evm-quote-warm-round on this kit)
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              mkdir -p "$RUNNER_TEMP/base"
              git archive "$PR_BASE" scripts | tar -x -f - -C "$RUNNER_TEMP/base"
              [ -e "$RUNNER_TEMP/base/scripts/ci/quote-speed.mjs" ] || { echo "main has no scripts/ci/quote-speed.mjs yet, so this pull request's own copy decides"; node scripts/ci/quote-speed.mjs "$PR_BASE" "$PR_HEAD"; exit; }
              node "$RUNNER_TEMP/base/scripts/ci/quote-speed.mjs" "$PR_BASE" "$PR_HEAD" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                node scripts/ci/quote-speed.mjs --all
              else
                node scripts/ci/quote-speed.mjs "$BEFORE" "$AFTER"
              fi ;;
            *) node scripts/ci/quote-speed.mjs --all ;;
          esac

  verify-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: the gate's own tests
        run: node --test scripts/ci/verify-gate.test.mjs
      # the gate runs as main has it, so a pull request cannot change its own gate: the base's whole scripts/ tree is
      # extracted, so every file the gate imports comes from the base too; the gate reads the PR from its working
      # directory, the head checkout (process.cwd(), scripts/ci/verify-gate.mjs and money-gate.mjs), never from its own
      # path. scripts/ci/base-gate.test.mjs replays these lines. The body goes in through env, never into the script text.
      - name: every commit names its card, and each card has its live check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE" scripts | tar -x -f - -C "$RUNNER_TEMP/base"
          node "$RUNNER_TEMP/base/scripts/ci/verify-gate.mjs" "$BASE" "$HEAD"

  # Each NEAR tx is read on FastNEAR's archive, dRPC and near.org's archive, which FastNEAR also runs
  # (scripts/ci/near-rpc-operators.mjs). near.org's host answers 429 with a Retry-After of 43 to 600 s (4 a minute,
  # 10 per 10 min, near.org's deprecation post; read 2026-10-31); the gate waits it out only while near.org could add
  # a second operator, which it never can once FastNEAR's archive read the tx ok: then it is asked once, unwaited. A
  # tx older than dRPC keeps (about 29 h on mainnet, read 2026-11-01) is proven instead: three dRPC reads (status, the
  # final block, that block by hash) and about 11 FastNEAR reads (the tx, its block, 4 to 10 blocks walked back to find
  # its block hash, one light-client proof per outcome), each host asked at most once a second, and no near.org wait.
  # --all read the 26 testnet txs in 3.6 min while dRPC held them (2026-11-01 13:35-13:38Z) and in 21 min with each one
  # proven instead (dRPC's tx reads forced missing, 13:38-13:59Z, FastNEAR's testnet archive answering 429): about
  # 8 s a tx read on two operators, about 48 s a tx proven. So 30 minutes covers the tests and about 150 txs dRPC still
  # holds, or about 30 proven ones, or one wait chain of up to 5 waits of 600 s on a tx FastNEAR's archive gave no answer
  # for; past that the check fails closed and is run again.
  money-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: the gate's own tests
        run: node --test scripts/ci/money-gate.test.mjs
      - name: the pull-request gate steps load each base gate with every file it imports
        run: node --test scripts/ci/base-gate.test.mjs
      - name: the testnet live check replays its recorded good and bad answers
        run: node --test scripts/live-checks/money-gate-testnet.test.mjs
      - name: every money-path live record's txs read back on chain
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              # as main has it, with the base's whole scripts/ tree (see verify-gate); it reads the head checkout
              mkdir -p "$RUNNER_TEMP/base"
              git archive "$PR_BASE" scripts | tar -x -f - -C "$RUNNER_TEMP/base"
              node "$RUNNER_TEMP/base/scripts/ci/money-gate.mjs" "$PR_BASE" "$PR_HEAD" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                node scripts/ci/money-gate.mjs --all
              else
                node scripts/ci/money-gate.mjs "$BEFORE" "$AFTER"
              fi ;;
            *) node scripts/ci/money-gate.mjs --all ;;
          esac

  # Each package's own fast tests. Two heavy suites stay out of these jobs: the near-sandbox tests (a cargo test target
  # with required-features = ["sandbox"], which a plain cargo test skips) and Playwright (a package's test:e2e script,
  # never its test script), but for the terminal's in-shell run below.
  #
  # The work runs as parallel shards, each a job with its own timeout, and the job `test` (a required check of main's
  # ruleset) passes only when every shard passed: one job ran it all in 19-20 minutes (run 41705134432: the package
  # tests 4m44s, wallet 3m08s of it; the terminal's browser runs 6m40s; the vault's scripts 1m48s; the Solana pool's
  # deploy tests 1m31s; cargo 2m38s), and a run cancelled at its 20-minute limit failed on the clock. Each shard is a
  # job named test-*, and scripts/ci/test-shards.test.mjs fails when one is missing from test's needs, when test
  # could pass on a shard that failed, was skipped or was cancelled, or when a shard has no timeout of its own.
  # scripts/ci/tests-run.test.mjs reads each pnpm --filter, so a package no shard selects fails it.
  test-wallet:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: the wallet package's test script
        run: pnpm --filter @blindfill/wallet run test

  test-packages:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: every other workspace package's test script
        run: pnpm -r --filter '!@blindfill/wallet' --if-present --no-bail run test
      - name: every workspace package's typecheck
        run: pnpm -r --if-present run typecheck
      - name: the deploy gate's own tests
        run: node --test apps/terminal/scripts/check-deploy.test.ts
      - name: every live check replays its recorded answers
        run: node --test scripts/live-checks/*.test.mjs
      # Every SIGN_HOST and APP_HOST live check that reads only what the host serves from the build runs its own read
      # and judge on this pull request's build: SIGN_HOST's committed index.html and public/ (the bytes its deploy
      # serves, held to a fresh build-app.mjs build by the signpage tests above) and the terminal's vite build. A change
      # that breaks one of their facts, or reshapes the code a check reads, fails here and not on the live host (card
      # signpage-check-shapes-on-build; scripts/ci/bundle-checks.mjs lists the checks left out, and why).
      - name: every bundle-reading SIGN_HOST and APP_HOST live check passes on this build
        run: pnpm --filter terminal build && node scripts/ci/bundle-checks.mjs

  # The mutant sweeps: each package's test:mutants (card fresh-run-margin), a shard of their own (card
  # mutant-sweep-no-orphans): in test-packages, after its tests, they grew from 351 s to 502 s and the job hit its
  # 15 minutes at f3a9cbb (run 42009584431, 904 s), cutting off the live replays. The README's test command runs a
  # package's test script only, so a reviewer's fresh run ends well inside readme-fresh-run's 15 minutes.
  # Split across the matrix (card ci-mutants-sharded): in one job they reached 838 s of its 900 at d208a681 (run
  # 42399498783) and were cancelled at the limit on PR #420 (run 42396730156). scripts/ci/test-shards.mjs splits each
  # package's test:mutants into its commands and gives each to exactly one part, by the job's own strategy.job-index
  # of strategy.job-total, balanced by the seconds each took on CI; its test fails when the heaviest part of this
  # matrix is planned over 540 s, and scripts/ci/tests-run.test.mjs reads the split, so no sweep is lost.
  # Five parts (cards helper-sell-sweep-in-ci, helper-release-sweep-in-ci): the helper's sell sweep runs as three
  # commands and its release sweep as one, at the seconds pull request #436's run read (MUTANT_SECONDS); five plan the
  # heaviest part at the kit's own 430 s, as six do (four would plan 484 s).
  # Seven parts (card held-move-forgotten-tx): the wallet's sweeps, the full-count property runs (FULL_RUNS=1) among
  # them, ran one after another in test-wallet after its tests, outside this split and its budget, and took it past its
  # 15 minutes on pull request #474 (run 42489996177, 14:28:48Z to 14:44:04Z); they join the split at the seconds
  # MUTANT_SECONDS reads, 961 s in all with restore-wallets' sweep, every sweep at the higher of #436's run and #474's
  # (run 42494845995), and seven plan the heaviest part at the kit's 468 s (six would plan 542 s).
  # Eight parts (card sol-rent-back-dust-burn): the signing page's rent back sweep grew to 66 plants, ran 643 s unsplit
  # and was cancelled at the job's limit on pull request #482 (job 128793441224); it runs as three commands of 22
  # plants, each planned at 240 s, and eight plan the heaviest part at 505 s (seven would plan 584 s).
  # scripts/ci/test-shards.test.mjs fails when any ci.yml line but a comment names test:mutants, in any runner's form.
  test-mutants:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: every workspace package's mutant sweeps, this part's share
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: node scripts/ci/test-shards.mjs mutants "$INDEX" "$TOTAL"

  # The terminal's browser runs, split across the matrix: scripts/ci/test-shards.mjs reads apps/terminal's test:e2e,
  # runs its first command (the build) in every part and gives each later command to exactly one part, by the job's
  # own strategy.job-index of strategy.job-total, so a part added to the matrix or to test:e2e is never dropped.
  test-browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Every browser the checks start is the installed Google Chrome with its sandbox on (scripts/browsers.mjs); the
      # action puts Google's current stable on the runner and proves the sandbox (its file says how).
      - name: Google Chrome stable, and its sandbox comes up
        uses: ./.github/actions/chrome
      # The terminal runs inside SIGN_HOST's shell: a top-level visit to APP_HOST lands on SIGN_HOST with the path kept,
      # and the framed terminal reads the shell's state with no hop (the live check app-in-shell in --harness mode, in
      # Chromium). Left to hand runs, a stale stand-in once failed on main unseen for hours. The same script runs BAR-10
      # (no text under 11 px, no phone tap box under 44 px) with the deployed app-shell check's own rules on the build,
      # inside the shell, every routed path (test/bar10/run.mjs).
      - name: the terminal's browser runs (in-shell, and BAR-10 on every routed path), this part's share
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          cmd="$(node scripts/ci/test-shards.mjs e2e "$INDEX" "$TOTAL")"
          echo "$cmd"
          cd apps/terminal && pnpm exec sh -c "$cmd"
      # The kit's one call in headless Chromium: the real prover worker under SIGN_HOST's own headers proves the fixture's
      # leaves, snarkjs accepts each proof, and a changed leaf or worker answer is refused (vault-prover-e2e; card
      # signpage-prover-host). The browser is the Chrome the step above installs. The first part runs it.
      - name: the prover in Chromium (KIT_PROVER_E2E)
        if: strategy.job-index == 0
        run: KIT_PROVER_E2E=1 node --test packages/kit/test/prove-e2e.test.ts

  test-scripts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: the vault's scripts' own tests
        run: pnpm run test:vault-scripts
      # the Solana pool's deploy script: its cleanup never strands a lamport on the run key, and every committed
      # deployment record's commitment is Poseidon(value, label, precommitment); the owner's mainnet paste refuses before
      # deploy.mjs runs (card pool-sol-deploy-mainnet)
      - name: the Solana pool's deploy script's own tests, and its mutation list still names its source and tests
        run: node --test contracts/pool-solana/scripts/deploy.test.mjs contracts/pool-solana/scripts/mutants.test.mjs contracts/pool-solana/scripts/pin.test.mjs contracts/pool-solana/scripts/mainnet-deploy.test.mjs
      # The EVM pool (contracts/pool-evm): forge-std from its submodule (v1.9.7, pinned by commit), Foundry v1.7.1 (the
      # version its tests were first run with, released 2026-05-08; its sha256 as the header reads it), solc 0.8.28 as
      # its foundry.toml pins. The forge tests run the kit's real proofs through the verifiers the pool deploys;
      # layout.test.mjs reads the pool's storage and ABI from the compiler. The buy's fork tests (Base and Robinhood at
      # pinned blocks) read only test/fork-rpc.mjs, which answers from the recorded test/fixtures/fork-rpc.json, so the
      # job reads no public RPC.
      - name: the EVM pool's forge-std
        run: bash scripts/ci/retry.sh git submodule update --init contracts/pool-evm/lib/forge-std
      # Foundry from the cache when it holds it (card ci-foundry-cached): foundry-toolchain's foundryup read
      # github.com/foundry-rs's release pages on every run, and they answered 504 from 8 Nov 08:45Z (PRs #454 and #455,
      # three runs each). On a miss scripts/ci/fetch.sh fetches the release asset through GitHub's API with the job's
      # read-only token, and the bytes must be the sha256 the header names, or the step fails and nothing is saved.
      - id: foundry-tgz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/foundry-1.7.1.tar.gz
          key: download-foundry-1.7.1-cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
      - name: Foundry v1.7.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/foundry-1.7.1.tar.gz cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b \
            https://api.github.com/repos/foundry-rs/foundry/releases/assets/415095756
          mkdir -p "$RUNNER_TEMP/foundry"
          tar -xzf ~/.cache/ci-downloads/foundry-1.7.1.tar.gz -C "$RUNNER_TEMP/foundry" forge cast anvil chisel
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry/forge" --version
      - if: steps.foundry-tgz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/foundry-1.7.1.tar.gz
          key: download-foundry-1.7.1-cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
      - name: the EVM pool's tests
        run: |
          node contracts/pool-evm/test/fork-rpc.mjs -- forge test --root contracts/pool-evm --no-storage-caching
          node --test contracts/pool-evm/test/*.test.mjs

  # rustc 1.96.0, the vault's build in the G1 gas proof (cargo-near 0.22.0); neither the kit nor the vault paper pins
  # one. rustup is on the ubuntu-24.04 image (actions/runner-images Ubuntu2404-Readme.md, read 2026-10-31 19:32Z).
  # No cache of the build (cargo's 2m38s here ends well inside the longest shard's time), but of cargo's registry: the
  # crates come from the cache when the lock has not moved, and a bad read from crates.io is fetched again by
  # scripts/ci/retry.sh (card ci-cargo-fetch-retry: main went red twice on ark-poly, curl [56] unexpected eof, runs
  # 42146603371 and 42148449367). scripts/ci/download-retry.mjs refuses a cargo step without that fetch before it.
  test-vault:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust 1.96.0
        run: bash scripts/ci/retry.sh rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/vault -> target
          cache-targets: "false"
          cache-bin: "false"
      - name: the vault's crates
        run: bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/Cargo.toml
      - name: the vault's own tests, without the sandbox suite
        run: cargo +1.96.0 test --locked --manifest-path contracts/vault/Cargo.toml

  # The required check: it runs whatever the shards ended with (always()), and passes only when each one passed. A
  # shard that failed, was skipped or was cancelled fails it; a test that skipped instead would pass the ruleset.
  test:
    needs: [test-wallet, test-packages, test-mutants, test-browser, test-scripts, test-vault]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every shard passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$NEEDS" | jq -e 'type == "object" and length > 0 and all(.[]; .result == "success")' > /dev/null || { echo "a shard did not pass"; exit 1; }
          echo "every shard passed"

  # The vault's near-sandbox suite (contracts/vault/tests/harness/run.sh: the vault, the mock token and the harness's
  # probe built with cargo-near, the pinned mainnet USDC and intents.near wasm, near-sandbox 2.13.4), which the test
  # job's plain cargo test builds empty. It runs when a change touches a file the suite reads (scripts/ci/vault-sandbox.mjs,
  # whose planted tests fail on a file the suite reads and the rule misses), on every push to main that does, nightly
  # and by hand; otherwise vault-sandbox passes with a printed skip. vault-sandbox-build builds the four wasm once
  # (run.sh --reproducible --build-only) and hands them, with the pinned two, to the four shards as one artifact; the
  # targets run on the shards (vault-sandbox.mjs SHARDS, each target in exactly one), which build no wasm. vault-sandbox
  # is the one check to require.
  #
  # The bytes (card vault-sandbox-shipped-bytes): the vault the shards test is the one the mainnet deploy ships, built
  # by contracts/vault/scripts/deploy.mjs --build-only --flavor mainnet as vault-build.yml builds it (two clean
  # `cargo near build reproducible-wasm` builds in the image contracts/vault/Cargo.toml pins by digest, compared). The
  # build job prints its sha256 and passes it to the shards as a job output; each shard's run.sh prints the size and
  # sha256 of the vault wasm it loaded and refuses, before any test, one that is not that sha256 or whose NEP-330
  # metadata is not a reproducible mainnet build of this commit (contracts/vault/scripts/shipped.mjs). That wasm names
  # its own commit, so it is built on every run and never cached: a key that names its inputs would name the commit.
  # Its cost, read in vault-build run 42318217392: 93 s for the first build (29 s of it pulling the image) and 64 s for
  # the second, about 2.6 min on the build job. A cache of the image would save at most the 29 s pull and costs a save
  # and a load of the image's tarball each time, so the image is pulled.
  #
  # Caches. Every key names its inputs and never the commit, so a key is saved once and read until an input changes
  # (each per-commit key once took 4 x 790 MB a push and the repo's 10 GB evicted them, so main ran cold: 641-691 s a
  # shard in run 41732950792, against 404-427 s warm in run 41786418173). No cache of the wasm (the shipped vault's
  # bytes name the commit, above; the three test builds took 24-26 s, runs 42313947891 and 42308584159).
  # cargo's registry and the dependencies built in the three target dirs: one Swatinem/rust-cache (keyed on rustc, the
  # CARGO_*/RUST* env and the locks, falling back to the newest entry for the same rustc and env), saved only by
  # vault-sandbox-build, which also builds every test target's dependencies when its key had no exact entry, so a shard
  # never builds them cold. The vault's own crates are never cached (rust-cache drops them), so each shard compiles them.
  vault-sandbox-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # On a pull request the rule runs as main has it (see verify-gate), so a pull request cannot edit the rule to skip
      # its own suite; it reads the head checkout, its working directory. While main has no rule yet, the suite runs.
      # scripts/ci/vault-sandbox.test.mjs fails when this step runs the head's copy on a pull request, and
      # scripts/ci/base-gate.test.mjs replays the pull_request lines (each names $RUNNER_TEMP, so it takes them all).
      - name: does this change touch what the suite reads
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              mkdir -p "$RUNNER_TEMP/base"
              git archive "$BASE" scripts | tar -x -f - -C "$RUNNER_TEMP/base"
              [ -e "$RUNNER_TEMP/base/scripts/ci/vault-sandbox.mjs" ] || { echo "run=true: main has no scripts/ci/vault-sandbox.mjs yet, so the suite runs"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
              node "$RUNNER_TEMP/base/scripts/ci/vault-sandbox.mjs" decide "$EVENT" "$BASE" "$HEAD" ;;
            *) node scripts/ci/vault-sandbox.mjs decide "$EVENT" "$BASE" "$HEAD" ;;
          esac

  vault-sandbox-build:
    needs: vault-sandbox-plan
    if: needs.vault-sandbox-plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      vault_sha256: ${{ steps.shipped.outputs.sha256 }}
    # rust-cache hashes every CARGO_*/RUST* variable into its key, so the build and the shards hold the same env
    # (vault-sandbox.test.mjs fails otherwise): smaller target dirs to cache, and neither changes what a test does
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # rustc 1.96.0 with the wasm target the three contracts build for (rustup is on the image, see the test job)
      - name: rust 1.96.0
        run: bash scripts/ci/retry.sh rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      # cargo-near 0.22.0, the release binary checked against the sha256 its release publishes (read 2026-11-02 12:41Z)
      - id: cargo-near-tgz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/cargo-near-0.22.0.tgz
          key: download-cargo-near-0.22.0-9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
      - name: install cargo-near
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/cargo-near-0.22.0.tgz 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf ~/.cache/ci-downloads/cargo-near-0.22.0.tgz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-near-x86_64-unknown-linux-gnu/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo +1.96.0 near --version
      - if: steps.cargo-near-tgz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/cargo-near-0.22.0.tgz
          key: download-cargo-near-0.22.0-9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
      - id: deps
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: vault-sandbox
          workspaces: |
            contracts/vault -> target
            contracts/vault/tests/mock-token -> target
            contracts/vault/tests/harness/probe -> target
          # ~/.cargo/bin keeps the sha256-checked cargo-near the step above installed, never a cached one
          cache-bin: "false"
      # the registry from that cache, and what it lacks from crates.io with a retry: run.sh and the test build below
      # meet no bad read from it (card ci-cargo-fetch-retry); download-retry.mjs holds one fetch per manifest they build
      - name: the crates of the vault and its two test contracts
        run: |
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/Cargo.toml
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/tests/mock-token/Cargo.toml
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/tests/harness/probe/Cargo.toml
      # the shipped vault (deploy.mjs's two clean reproducible builds, in cargo-near's container, where no fetch from
      # the runner reaches: 3 tries, each into an emptied dir, never again after deploy.mjs's exit 3 for two builds that
      # differ, as vault-build.yml runs it), the three test builds and the pinned two
      - name: the four wasm, built once for every shard, and the pinned two
        run: RETRY_FINAL=3 bash scripts/ci/retry.sh bash scripts/ci/fresh-dir.sh "$RUNNER_TEMP/vault-wasm" contracts/vault/tests/harness/run.sh --reproducible --build-only "$RUNNER_TEMP/vault-wasm"
      # the shards refuse any vault wasm but this one
      - name: the shipped vault's sha256, for the shards
        id: shipped
        run: |
          node contracts/vault/scripts/shipped.mjs "$RUNNER_TEMP/vault-wasm/blindfill_vault.wasm"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/vault-wasm/blindfill_vault.wasm" | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      # the shards' dependencies, built here when the cache had no exact entry, so no shard builds them cold: the lib's
      # test build takes every dev-dependency with the sandbox feature, as each test target does, and links one binary
      # (every target's took 7m23s in run 41792397381, most of it linking the vault's own targets, which no cache keeps)
      - name: every sandbox test target's dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: cargo +1.96.0 test --locked --manifest-path contracts/vault/Cargo.toml --features sandbox --lib --no-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-wasm
          path: ${{ runner.temp }}/vault-wasm
          if-no-files-found: error
          retention-days: 1

  vault-sandbox-shard:
    needs: [vault-sandbox-plan, vault-sandbox-build]
    if: needs.vault-sandbox-plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # the same env as vault-sandbox-build's (rust-cache's key)
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # relayer_send and s02 start the helper's TypeScript, which imports the workspace's packages
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # the same toolchains as vault-sandbox-build (rust-cache hashes every installed rustc into its key), with the wasm
      # target: s20 runs contracts/vault/scripts/deploy.mjs, whose two clean builds of the recipe (cargo-near, in their
      # own target dirs) are what it proves, so every shard has cargo-near (vault-sandbox.test.mjs fails otherwise)
      - name: rust 1.96.0
        run: bash scripts/ci/retry.sh rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      # cargo-near 0.22.0, the release binary checked against the sha256 its release publishes (read 2026-11-02 12:41Z)
      - id: cargo-near-tgz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/cargo-near-0.22.0.tgz
          key: download-cargo-near-0.22.0-9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
      - name: install cargo-near
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/cargo-near-0.22.0.tgz 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf ~/.cache/ci-downloads/cargo-near-0.22.0.tgz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-near-x86_64-unknown-linux-gnu/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo +1.96.0 near --version
      - if: steps.cargo-near-tgz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/cargo-near-0.22.0.tgz
          key: download-cargo-near-0.22.0-9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
      # vault-sandbox-build's cache, read only
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: vault-sandbox
          workspaces: |
            contracts/vault -> target
            contracts/vault/tests/mock-token -> target
            contracts/vault/tests/harness/probe -> target
          cache-bin: "false"
          save-if: "false"
      # what that cache lacks comes from crates.io with a retry (card ci-cargo-fetch-retry), as in vault-sandbox-build
      - name: the crates of the vault and its two test contracts
        run: |
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/Cargo.toml
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/tests/mock-token/Cargo.toml
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/vault/tests/harness/probe/Cargo.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vault-wasm
          path: ${{ runner.temp }}/vault-wasm
      # run.sh prints the vault wasm's size and sha256 and refuses one that is not the build job's shipped vault
      - name: the shard's sandbox tests, on the wasm vault-sandbox-build built
        env:
          SHARD: ${{ matrix.shard }}
          VAULT_WASM_SHA256: ${{ needs.vault-sandbox-build.outputs.vault_sha256 }}
        run: |
          read -ra ARGS <<<"$(node scripts/ci/vault-sandbox.mjs shard "$SHARD")"
          VAULT_WASM_DIR="$RUNNER_TEMP/vault-wasm" contracts/vault/tests/harness/run.sh "${ARGS[@]}"

  vault-sandbox:
    needs: [vault-sandbox-plan, vault-sandbox-build, vault-sandbox-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every shard passed, or the change touches nothing the suite reads
        env:
          PLAN: ${{ needs.vault-sandbox-plan.result }}
          RUN: ${{ needs.vault-sandbox-plan.outputs.run }}
          BUILD: ${{ needs.vault-sandbox-build.result }}
          SHARDS: ${{ needs.vault-sandbox-shard.result }}
        run: |
          if [ "$PLAN" != success ]; then echo "the plan job ended $PLAN"; exit 1; fi
          if [ "$RUN" != true ]; then echo "skip: this change touches no file the vault's sandbox suite reads"; exit 0; fi
          if [ "$BUILD" != success ]; then echo "the wasm build ended $BUILD"; exit 1; fi
          if [ "$SHARDS" != success ]; then echo "a shard ended $SHARDS"; exit 1; fi
          echo "every shard passed"

  # The Solana pool program (contracts/pool-solana): its host unit tests (the vault's vectors and real proof), its
  # build with cargo-build-sbf, then its LiteSVM tests on that build (svm-tests/: deposits, then releases with real
  # proofs made for the pool, and every refusal). The build tools are agave v4.4.0's release (cargo-build-sbf 4.4.0,
  # the version the tests were first run with), checked against the sha256 of the tarball read 2026-11-02 19:56Z;
  # cargo-build-sbf fetches its pinned platform-tools on first use. rustc 1.96.0 for the program as the test job's; rustc
  # 1.97.1 for the LiteSVM tests, the least agave 4.3's crates (litesvm 0.17.0's runtime) build with.
  pool-solana:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust 1.96.0 and 1.97.1
        run: bash scripts/ci/retry.sh rustup toolchain install 1.96.0 1.97.1 --profile minimal
      # from the cache when it holds it (scripts/ci/fetch.sh checks the sha256 after the restore and after a fetch)
      - id: agave-tar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/agave-4.4.0.tar.bz2
          key: download-agave-4.4.0-3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574
      - name: install the Solana build tools (agave v4.4.0)
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/agave-4.4.0.tar.bz2 3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574 \
            https://github.com/anza-xyz/agave/releases/download/v4.4.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar -xjf ~/.cache/ci-downloads/agave-4.4.0.tar.bz2 -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - if: steps.agave-tar.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/agave-4.4.0.tar.bz2
          key: download-agave-4.4.0-3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cache/solana
            contracts/pool-solana/target
            contracts/pool-solana/svm-tests/target
          # keyed on its inputs, never the commit (see the vault's sandbox suite above): saved once per toolchain and locks
          key: pool-solana-rustc-1.96.0-1.97.1-agave-4.4.0-${{ hashFiles('contracts/pool-solana/Cargo.lock', 'contracts/pool-solana/svm-tests/Cargo.lock') }}
          restore-keys: |
            pool-solana-
      # the registry from that cache, and what it lacks from crates.io with a retry (card ci-cargo-fetch-retry): the
      # three crates cargo-build-sbf and both cargo tests build, and dry-run.sh's build of the pool program, find them
      # in ~/.cargo/registry. svm-tests builds with 1.97.1, so its fetch reads its lock with that cargo.
      - name: the pool program's crates
        run: |
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/pool-solana/Cargo.toml
          bash scripts/ci/retry.sh cargo +1.96.0 fetch --locked --manifest-path contracts/pool-solana/svm-tests/evil-venue/Cargo.toml
          bash scripts/ci/retry.sh cargo +1.97.1 fetch --locked --manifest-path contracts/pool-solana/svm-tests/Cargo.toml
      - name: the pool program's unit tests
        run: cargo +1.96.0 test --locked --manifest-path contracts/pool-solana/Cargo.toml
      # cargo-build-sbf only warns when a function's frame passes SBF's 4 KiB stack ("may cause undefined behavior"):
      # the first build of this program did, and its pairing input came out wrong on chain. The step refuses it.
      - name: the pool program's build, refused if a stack frame overflows
        working-directory: contracts/pool-solana
        run: |
          cargo-build-sbf --sbf-out-dir out -- --locked 2>&1 | tee "$RUNNER_TEMP/sbf.log"
          test "${PIPESTATUS[0]}" = 0
          if grep -q "overflows the maximum allowed frame space" "$RUNNER_TEMP/sbf.log"; then echo "a stack frame overflows 4 KiB"; exit 1; fi
      # The code a devnet pool deploys is this build, byte for byte (a build on another host gives other bytes): its sha256,
      # the commit built and the toolchain go in this log, which deploy.mjs --ci-run reads, and the file is uploaded below.
      - name: the pool program's code hash, commit and toolchain
        working-directory: contracts/pool-solana/out
        run: |
          sha256sum blindfill_pool_solana.so | tee blindfill_pool_solana.so.sha256
          echo "pool-solana code: sha256 $(cut -d' ' -f1 blindfill_pool_solana.so.sha256), $(wc -c < blindfill_pool_solana.so) bytes, commit $(git rev-parse HEAD)"
          cargo-build-sbf --version | sed 's/^/pool-solana toolchain: /'
          solana --version | sed 's/^/pool-solana toolchain: /'
      # The pinned code (the "Program sha256:" line of contracts/pool-review-2.md, scripts/pin.mjs): this build must be
      # it, byte for byte, as the box's build of the same tree is (pool review round 2: a one-line comment moved seven
      # panic line numbers in the code). A source change that moves the bytes fails here until its pin is moved by a
      # build of the deploy sha.
      - name: the pool program's build is the pinned code
        run: node contracts/pool-solana/scripts/pin.mjs contracts/pool-solana/out/blindfill_pool_solana.so
      # svm-tests' tag 3 tests: a hostile venue (re-entry, a venue taking pool lamports), and copies of mainnet's pump,
      # PumpSwap and fee programs, whose code is not committed (closed source) and must hash as the fixtures' JSON says:
      # a pump upgrade fails here until the fixtures are re-dumped.
      - name: the hostile test venue's build
        working-directory: contracts/pool-solana/svm-tests/evil-venue
        run: cargo-build-sbf --sbf-out-dir ../../out -- --locked
      - name: the venue fetch's own tests (a code change, a retried and a failed RPC, on fake RPCs)
        run: node --test contracts/pool-solana/fixtures/venues/dump.test.mjs
      - name: the venues' mainnet code, sha256-checked
        working-directory: contracts/pool-solana
        run: node fixtures/venues/dump.mjs --programs-only
      - name: the pool program's LiteSVM tests, on that build
        run: |
          POOL_SO="$PWD/contracts/pool-solana/out/blindfill_pool_solana.so" \
            cargo +1.97.1 test --locked --manifest-path contracts/pool-solana/svm-tests/Cargo.toml
      # uploaded only once its tests passed: the file deploy.mjs --ci-run deploys
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pool-solana-so
          path: |
            contracts/pool-solana/out/blindfill_pool_solana.so
            contracts/pool-solana/out/blindfill_pool_solana.so.sha256
          if-no-files-found: error
          retention-days: 90
      # deploy.mjs's seven stops on a fresh solana-test-validator (scripts/dry-run.sh's header lists them): it fails
      # when a funder is left holding lamports, a run's keys are not removed, a buffer is left or a live check fails.
      # deploy.mjs and the live checks load the workspace's packages, so node and the install come first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: the deploy script's dry run, every stop giving back every lamport
        run: bash contracts/pool-solana/scripts/dry-run.sh

  # Slither on the EVM pool (card pool-review-3), advisory: not a required check. slither-analyzer 0.11.6 (uploaded to
  # PyPI 2026-07-28) and its dependencies install only here, from contracts/pool-evm/slither/requirements.txt, each at
  # one version with its sha256s (pip --require-hashes), nothing in it uploaded after 2026-10-23. Slither builds the pool
  # with the Foundry the test job uses (v1.7.1) and reads src/ and lean-imt, not forge-std or the tests.
  # scripts/ci/slither-gate.mjs fails the job on a High or Medium hit that contracts/pool-evm/slither/triage.json does
  # not list (printing the entry to add) and on a listed entry Slither no longer reports.
  slither:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the EVM pool's forge-std
        run: bash scripts/ci/retry.sh git submodule update --init contracts/pool-evm/lib/forge-std
      # Foundry as test-scripts has it: from the cache, or on a miss through GitHub's API (card ci-foundry-cached)
      - id: foundry-tgz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/foundry-1.7.1.tar.gz
          key: download-foundry-1.7.1-cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
      - name: Foundry v1.7.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/foundry-1.7.1.tar.gz cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b \
            https://api.github.com/repos/foundry-rs/foundry/releases/assets/415095756
          mkdir -p "$RUNNER_TEMP/foundry"
          tar -xzf ~/.cache/ci-downloads/foundry-1.7.1.tar.gz -C "$RUNNER_TEMP/foundry" forge cast anvil chisel
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry/forge" --version
      - if: steps.foundry-tgz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/foundry-1.7.1.tar.gz
          key: download-foundry-1.7.1-cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: slither-analyzer 0.11.6, hash-pinned, in its own venv
        run: |
          python3 -m venv "$RUNNER_TEMP/slither-venv"
          bash scripts/ci/retry.sh "$RUNNER_TEMP/slither-venv/bin/pip" install --require-hashes --no-deps -r contracts/pool-evm/slither/requirements.txt
          echo "$RUNNER_TEMP/slither-venv/bin" >> "$GITHUB_PATH"
      - name: Slither on contracts/pool-evm
        working-directory: contracts/pool-evm
        run: |
          slither --version
          slither . --json "$RUNNER_TEMP/slither.json" --fail-none --filter-paths 'lib/forge-std/|test/|script/'
      - name: every High and Medium hit triaged
        run: node scripts/ci/slither-gate.mjs "$RUNNER_TEMP/slither.json" contracts/pool-evm/slither/triage.json
