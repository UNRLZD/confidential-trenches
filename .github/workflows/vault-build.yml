# The vault's mainnet build, rebuilt on a clean Linux runner on every change to contracts/vault/ and by hand: two clean
# reproducible builds by contracts/vault/scripts/deploy.mjs --build-only (`cargo near build reproducible-wasm` in the
# Docker image contracts/vault/Cargo.toml pins by digest, each into its own new out dir, their sha256 compared, the
# wasm's NEP-330 metadata naming the checked-out HEAD, then every deploy refusal for a mainnet build: the banned
# imports, the promise and export lists, the function body limit, the required exports and mainnet USDC as the only
# token). The metadata names its own commit, so no hash committed in the repository can be the build of the commit that
# holds it: the job never compares HEAD's build with a pin. Instead deploy.mjs --verify-records rebuilds every vault
# deploy record in contracts/vault/deployments/ at the record's own source_commit and fails unless the sha256 is the
# record's code hash; a record marked non_reproducible (an earlier host build) is printed as a NOTE and never compared.
# HEAD's build is uploaded, with its sha256, as the artifact vault-mainnet-wasm, which the owner's deploy paste
# downloads by this run's id (gh run download <id> -n vault-mainnet-wasm); deploy.mjs deploys it on mainnet only with a
# record naming that commit, its sha256 and MAINNET_PINS' pin. The checkout is the full history, for the records'
# commits.
# The paths are every file the build and pin steps read: contracts/vault/ and deploy.mjs's imports
# (contracts/vault/scripts/deploy.test.mjs holds the list against them), scripts/ci/retry.sh, scripts/ci/fetch.sh and
# scripts/ci/fresh-dir.sh.
# The two builds run in cargo-near's container, which fetches the crates there: no fetch from the runner reaches them, so a
# bad read from crates.io is met by running each build again, 3 tries through scripts/ci/retry.sh, each into an emptied
# build dir (scripts/ci/fresh-dir.sh), as scripts/ci/download-retry.mjs requires (card ci-cargo-fetch-retry). Only a
# failure before any hash exists is tried again: deploy.mjs ends with exit 3 (EXIT_HASH_DISAGREE) when the two builds
# differ or a record rebuilds to another hash, and RETRY_FINAL=3 stops retry.sh at once on it, so a build that is
# reproducible only some of the time is red on its first try. The command built is deploy.mjs's own and unchanged, so
# a commit's code hash is the one it was.
# No secret and no token beyond the read-only one GitHub gives every run. Actions pinned by commit sha as ci.yml has
# them (actions/checkout v7.0.1, actions/setup-node v7.1.0, actions/upload-artifact v7.0.2, actions/cache/restore and
# actions/cache/save v6.1.0).
name: vault-build

on:
  pull_request:
    paths:
      - "contracts/vault/**"
      - ".github/workflows/vault-build.yml"
      - "scripts/net-window.mjs"
      - "scripts/live-checks/vault-skeleton.mjs"
      - "scripts/live-checks/vault-testnet-t01.mjs"
      - "scripts/ci/near-rpc-operators.mjs"
      - "scripts/ci/rpc-wait.mjs"
      - "scripts/ci/retry.sh"
      - "scripts/ci/fetch.sh"
      - "scripts/ci/fresh-dir.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mainnet-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # rustc 1.96.0 with the wasm target (rustup is on the image, as ci.yml's test-vault job reads it)
      - name: rust 1.96.0
        run: bash scripts/ci/retry.sh rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      # cargo-near 0.22.0, the release binary checked against the sha256 ci.yml checks it by
      - id: cargo-near-tgz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/cargo-near-0.22.0.tgz
          key: download-cargo-near-0.22.0-9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
      - name: install cargo-near
        run: |
          bash scripts/ci/fetch.sh ~/.cache/ci-downloads/cargo-near-0.22.0.tgz 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf ~/.cache/ci-downloads/cargo-near-0.22.0.tgz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-near-x86_64-unknown-linux-gnu/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo +1.96.0 near --version
      - if: steps.cargo-near-tgz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-downloads/cargo-near-0.22.0.tgz
          key: download-cargo-near-0.22.0-9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
      - name: two clean mainnet builds that must agree
        run: |
          RETRY_FINAL=3 bash scripts/ci/retry.sh bash scripts/ci/fresh-dir.sh "$RUNNER_TEMP/vault-mainnet" node contracts/vault/scripts/deploy.mjs --build-only --flavor mainnet --build-dir "$RUNNER_TEMP/vault-mainnet" 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" = 0
          cd "$RUNNER_TEMP/vault-mainnet"
          sha256sum blindfill_vault.wasm | tee blindfill_vault.wasm.sha256
          cp "$RUNNER_TEMP/build.log" build.log
      # each vault deploy record rebuilt at its own commit to its code hash; a non_reproducible record is a NOTE
      - name: every vault deploy record rebuilds to its code hash
        run: RETRY_FINAL=3 bash scripts/ci/retry.sh bash scripts/ci/fresh-dir.sh "$RUNNER_TEMP/vault-records" node contracts/vault/scripts/deploy.mjs --verify-records --build-dir "$RUNNER_TEMP/vault-records"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-mainnet-wasm
          path: ${{ runner.temp }}/vault-mainnet
          if-no-files-found: error
          retention-days: 90
