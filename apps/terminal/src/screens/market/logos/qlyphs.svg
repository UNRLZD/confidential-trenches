<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Qlyphs mark: a ring "Q" whose tail is a square glyph in flare, set off from the ring by a cut. -->
  <rect width="32" height="32" rx="7" fill="#0E0E0E"/>
  <g transform="translate(4.8 4.8) scale(0.9667)" fill="none">
    <mask id="cut">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="12.4" y="12.4" width="11" height="11" rx="2.6" fill="#000"/>
    </mask>
    <circle cx="11" cy="11" r="7.7" stroke="#E8E6E0" stroke-width="2.6" mask="url(#cut)"/>
    <rect x="14.6" y="14.6" width="6.6" height="6.6" rx="1.5" fill="#FF6B35"/>
  </g>
</svg>
