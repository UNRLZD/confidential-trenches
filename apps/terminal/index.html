<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Confidential Trenches</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The boot frame (BAR-03): the shell's header, the screen's frame and the phone's tab bar, drawn by this file and
         shell.css before the script runs, so a new frame of the app (the first load, and the return from SIGN_HOST's
         screens, where the shell makes a new one) has content from its first paint. No words: the faces load later.
         Hidden by shell.css the moment the app draws into #root, in the same frame; hidden too until shell.css applies
         (the hidden attribute, which shell.css overrides), so an unstyled first layout draws nothing that moves. -->
    <div id="boot" aria-hidden="true" hidden>
      <div class="boot-tb">
        <span class="ctlogo">
          <span class="dots">
            <picture><source media="(min-resolution: 1.5dppx)" srcset="/src/shell/brand/ct-stack-2x-cool.svg" /><img src="/src/shell/brand/ct-stack-1x-cool.svg" alt="" /></picture>
            <picture><source media="(min-resolution: 1.5dppx)" srcset="/src/shell/brand/ct-stack-2x.svg" /><img src="/src/shell/brand/ct-stack-1x.svg" alt="" /></picture>
          </span>
        </span>
      </div>
      <div class="boot-screen"><div class="boot-panel"></div></div>
      <div class="boot-ft"></div>
      <div class="phh">
        <span class="hit44">
          <span class="ctlogo ph">
            <span class="dots"><img src="/src/shell/brand/ct-stack-phone-2x-cool.svg" alt="" /><img src="/src/shell/brand/ct-stack-phone-2x.svg" alt="" /></span>
          </span>
        </span>
      </div>
      <div class="tabbar">
          <span class="tb4"><span class="pl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 4 4L21 7" /><path d="M15 7h6v6" /></svg></span></span>
          <span class="tb4"><span class="pl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0" /><path d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z" /></svg></span></span>
          <span class="tb4"><span class="pl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z" /><path d="M15 3.5a9 9 0 0 1 5.5 5.5H15z" /></svg></span></span>
          <span class="tb4"><span class="pl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8" /><path d="M4.5 20c1.4-3.3 4.2-5 7.5-5s6.1 1.7 7.5 5" /></svg></span></span>
      </div>
    </div>
  </body>
</html>
