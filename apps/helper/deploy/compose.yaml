# The helper and Caddy on one host. Only Caddy is published (80, 443 and 443/udp for HTTP/3).
#   HELPER_COMMIT=<40 hex> docker compose up -d --build
# On the server, deploy/redeploy.sh <40 hex> runs it, with HELPER_COMMIT and HELPER_RELEASE written to deploy/.env (a
# first start with this command; a later deploy swaps the helper with no gap, see the script).
name: ct-helper
services:
  helper:
    build:
      # the repository root, so the image loads the kit as the package @blindfill/kit (apps/helper/Dockerfile)
      context: ../../..
      dockerfile: apps/helper/Dockerfile
      args:
        HELPER_COMMIT: ${HELPER_COMMIT:?set HELPER_COMMIT}
    image: ct-helper:${HELPER_COMMIT:?set HELPER_COMMIT}
    # The vendor keys (src/proxy/vendors.ts), from the host only: the shell that runs compose, or deploy/.env next to
    # this file (chmod 600, ignored by git, outside the image). An empty one means that vendor is called with no key.
    environment:
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      ONECLICK_JWT: ${ONECLICK_JWT:-}
      # Every other name src/ reads (deploy/env-names.test.mjs holds the list to src): the RPC providers (src/rpc/rpc.ts,
      # src/token-status/, src/withdraw/fee.ts; empty: the public endpoint) and the release's withdrawal relayer per
      # network (src/withdraw/fee.ts; empty: that network is not quoted).
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      # the token page's holder rows (src/data/solana/token.ts, D-S11): a keyed provider that answers
      # getTokenLargestAccounts; empty: holders is Jupiter's count and top-10 share, with no rows
      SOLANA_HOLDERS_RPC_URL: ${SOLANA_HOLDERS_RPC_URL:-}
      # Solana's own trade reads (src/data/solana/trades.ts): a keyed provider's websocket for the per-token log stream
      # and its HTTP endpoint for the reads, asked first; empty: the public endpoints
      SOLANA_STREAM_WS_URL: ${SOLANA_STREAM_WS_URL:-}
      SOLANA_TRADES_RPC_URL: ${SOLANA_TRADES_RPC_URL:-}
      # the testnet build's second Solana provider, POST /v1/rpc/solana-devnet (src/rpc/rpc.ts): a keyed devnet URL of
      # another operator than api.devnet.solana.com, which the page reads itself; empty: the route answers 503 (no fallback)
      SOLANA_DEVNET_RPC_URL: ${SOLANA_DEVNET_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      ROBINHOOD_RPC_URL: ${ROBINHOOD_RPC_URL:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-}
      NEAR_RPC_URL_B: ${NEAR_RPC_URL_B:-}
      NEAR_TESTNET_RPC_URL: ${NEAR_TESTNET_RPC_URL:-}
      NEAR_TESTNET_RPC_URL_B: ${NEAR_TESTNET_RPC_URL_B:-}
      # each chain's keyed list after the names above (src/rpc/rpc.ts RPC_UPSTREAMS keyed; card rpc-keyed-lists), one
      # company each but dRPC's three keys (three accounts), written by the research repo's scripts/deploy/set-rpc-keys.sh;
      # empty: that slot is skipped
      BASE_RPC_URL_QUICKNODE: ${BASE_RPC_URL_QUICKNODE:-}
      BASE_RPC_URL_DRPC_1: ${BASE_RPC_URL_DRPC_1:-}
      BASE_RPC_URL_DRPC_2: ${BASE_RPC_URL_DRPC_2:-}
      BASE_RPC_URL_DRPC_3: ${BASE_RPC_URL_DRPC_3:-}
      ROBINHOOD_RPC_URL_QUICKNODE: ${ROBINHOOD_RPC_URL_QUICKNODE:-}
      ROBINHOOD_RPC_URL_DRPC_1: ${ROBINHOOD_RPC_URL_DRPC_1:-}
      ROBINHOOD_RPC_URL_DRPC_2: ${ROBINHOOD_RPC_URL_DRPC_2:-}
      ROBINHOOD_RPC_URL_DRPC_3: ${ROBINHOOD_RPC_URL_DRPC_3:-}
      SOLANA_RPC_URL_QUICKNODE: ${SOLANA_RPC_URL_QUICKNODE:-}
      SOLANA_RPC_URL_DRPC_1: ${SOLANA_RPC_URL_DRPC_1:-}
      SOLANA_RPC_URL_DRPC_2: ${SOLANA_RPC_URL_DRPC_2:-}
      SOLANA_RPC_URL_DRPC_3: ${SOLANA_RPC_URL_DRPC_3:-}
      NEAR_RPC_URL_FASTNEAR: ${NEAR_RPC_URL_FASTNEAR:-}
      # each keyed company's daily budget in its own unit (src/limits/limits.ts KEYED_DAY: QuickNode credits, dRPC compute
      # units, FastNear requests; review M2), not a secret; empty: its smallest plan's month over 31 days
      RPC_DAY_QUICKNODE: ${RPC_DAY_QUICKNODE:-}
      RPC_DAY_DRPC: ${RPC_DAY_DRPC:-}
      RPC_DAY_FASTNEAR: ${RPC_DAY_FASTNEAR:-}
      # each chain's RPC budget per 10 s, "<total>,<per client>" (src/rpc/rpc.ts; empty: the public provider's limit)
      RPC_BUDGET_SOLANA: ${RPC_BUDGET_SOLANA:-}
      RPC_BUDGET_BASE: ${RPC_BUDGET_BASE:-}
      RPC_BUDGET_ROBINHOOD: ${RPC_BUDGET_ROBINHOOD:-}
      RPC_BUDGET_NEAR: ${RPC_BUDGET_NEAR:-}
      RPC_BUDGET_SOLANA_DEVNET: ${RPC_BUDGET_SOLANA_DEVNET:-}
      # each vendor's budget per 10 s, "<total>,<per client>" (src/proxy/proxy.ts; empty: the vendor's published limit
      # for a starting key); set it to the key's plan
      PROXY_BUDGET_JUPITER: ${PROXY_BUDGET_JUPITER:-}
      PROXY_BUDGET_RELAY: ${PROXY_BUDGET_RELAY:-}
      PROXY_BUDGET_LIFI: ${PROXY_BUDGET_LIFI:-}
      PROXY_BUDGET_ONECLICK: ${PROXY_BUDGET_ONECLICK:-}
      WITHDRAW_RELAYER_MAINNET: ${WITHDRAW_RELAYER_MAINNET:-}
      WITHDRAW_FEE_RECIPIENT_MAINNET: ${WITHDRAW_FEE_RECIPIENT_MAINNET:-}
      WITHDRAW_RELAYER_TESTNET: ${WITHDRAW_RELAYER_TESTNET:-}
      WITHDRAW_FEE_RECIPIENT_TESTNET: ${WITHDRAW_FEE_RECIPIENT_TESTNET:-}
      # POST /v1/withdraw per network (src/withdraw/send.ts; empty: that network's withdrawals are not carried): the
      # release's vault, the relayer account's full-access keys (gas NEAR only, comma-separated, one nonce lane each),
      # and the release number (one above the last release's; a rollback ships with the next number)
      WITHDRAW_VAULT_MAINNET: ${WITHDRAW_VAULT_MAINNET:-}
      WITHDRAW_RELAYER_KEYS_MAINNET: ${WITHDRAW_RELAYER_KEYS_MAINNET:-}
      WITHDRAW_VAULT_TESTNET: ${WITHDRAW_VAULT_TESTNET:-}
      WITHDRAW_RELAYER_KEYS_TESTNET: ${WITHDRAW_RELAYER_KEYS_TESTNET:-}
      # POST /v1/bind per network (src/bind/env.ts; empty: that network's deposits are not carried): the release's vault
      # (the same as WITHDRAW_VAULT_<NET> when both are set), the gas account that sends deposits and its one
      # full-access key (gas and storage prepays only), and R4's margin K in blocks (the release's pin, 1 to 600)
      BIND_VAULT_MAINNET: ${BIND_VAULT_MAINNET:-}
      BIND_RELAYER_MAINNET: ${BIND_RELAYER_MAINNET:-}
      BIND_RELAYER_KEY_MAINNET: ${BIND_RELAYER_KEY_MAINNET:-}
      BIND_VAULT_TESTNET: ${BIND_VAULT_TESTNET:-}
      BIND_RELAYER_TESTNET: ${BIND_RELAYER_TESTNET:-}
      BIND_RELAYER_KEY_TESTNET: ${BIND_RELAYER_KEY_TESTNET:-}
      BIND_MARGIN_K: ${BIND_MARGIN_K:-}
      # GET /v1/pool/fee and POST /v1/pool/solana/send per cluster (src/pool/solana.ts; empty: that cluster's pool is
      # not carried): the pool program, the fee payer's key (base58 of 64 bytes, gas SOL only), the fee in lamports
      # (rounded up to 100,000, at least a release's worst cost) and two RPC URLs, comma-separated
      POOL_SOLANA_PROGRAM_MAINNET: ${POOL_SOLANA_PROGRAM_MAINNET:-}
      POOL_SOLANA_FEE_PAYER_KEY_MAINNET: ${POOL_SOLANA_FEE_PAYER_KEY_MAINNET:-}
      POOL_SOLANA_FEE_MAINNET: ${POOL_SOLANA_FEE_MAINNET:-}
      POOL_SOLANA_RPCS_MAINNET: ${POOL_SOLANA_RPCS_MAINNET:-}
      POOL_SOLANA_PROGRAM_DEVNET: ${POOL_SOLANA_PROGRAM_DEVNET:-}
      POOL_SOLANA_FEE_PAYER_KEY_DEVNET: ${POOL_SOLANA_FEE_PAYER_KEY_DEVNET:-}
      POOL_SOLANA_FEE_DEVNET: ${POOL_SOLANA_FEE_DEVNET:-}
      POOL_SOLANA_RPCS_DEVNET: ${POOL_SOLANA_RPCS_DEVNET:-}
      # POST /v1/pool/evm/send per network (src/pool/evm.ts; empty: that network's pool is not carried): the pool, the
      # sender's key (0x + 64 hex, gas only), the fee in the asset's base units, its recipient (empty: the sender) and
      # two RPC URLs of two operators, comma-separated (empty: the kit's fee pair). The first takes every read one
      # provider answers and every send, so it is the faster pace: Robinhood's is
      # https://robinhood.drpc.org,https://rpc.mainnet.chain.robinhood.com (dRPC 15 a second first, Robinhood's own at 1
      # a second second; the kit's order, card robinhood-mainnet-rpcs)
      POOL_EVM_ADDRESS_BASE: ${POOL_EVM_ADDRESS_BASE:-}
      POOL_EVM_SENDER_KEY_BASE: ${POOL_EVM_SENDER_KEY_BASE:-}
      POOL_EVM_FEE_BASE: ${POOL_EVM_FEE_BASE:-}
      POOL_EVM_FEE_RECIPIENT_BASE: ${POOL_EVM_FEE_RECIPIENT_BASE:-}
      POOL_EVM_RPCS_BASE: ${POOL_EVM_RPCS_BASE:-}
      POOL_EVM_ADDRESS_ROBINHOOD: ${POOL_EVM_ADDRESS_ROBINHOOD:-}
      POOL_EVM_SENDER_KEY_ROBINHOOD: ${POOL_EVM_SENDER_KEY_ROBINHOOD:-}
      POOL_EVM_FEE_ROBINHOOD: ${POOL_EVM_FEE_ROBINHOOD:-}
      POOL_EVM_FEE_RECIPIENT_ROBINHOOD: ${POOL_EVM_FEE_RECIPIENT_ROBINHOOD:-}
      POOL_EVM_RPCS_ROBINHOOD: ${POOL_EVM_RPCS_ROBINHOOD:-}
      POOL_EVM_ADDRESS_BASE_SEPOLIA: ${POOL_EVM_ADDRESS_BASE_SEPOLIA:-}
      POOL_EVM_SENDER_KEY_BASE_SEPOLIA: ${POOL_EVM_SENDER_KEY_BASE_SEPOLIA:-}
      POOL_EVM_FEE_BASE_SEPOLIA: ${POOL_EVM_FEE_BASE_SEPOLIA:-}
      POOL_EVM_FEE_RECIPIENT_BASE_SEPOLIA: ${POOL_EVM_FEE_RECIPIENT_BASE_SEPOLIA:-}
      POOL_EVM_RPCS_BASE_SEPOLIA: ${POOL_EVM_RPCS_BASE_SEPOLIA:-}
      POOL_EVM_ADDRESS_ROBINHOOD_TESTNET: ${POOL_EVM_ADDRESS_ROBINHOOD_TESTNET:-}
      POOL_EVM_SENDER_KEY_ROBINHOOD_TESTNET: ${POOL_EVM_SENDER_KEY_ROBINHOOD_TESTNET:-}
      POOL_EVM_FEE_ROBINHOOD_TESTNET: ${POOL_EVM_FEE_ROBINHOOD_TESTNET:-}
      POOL_EVM_FEE_RECIPIENT_ROBINHOOD_TESTNET: ${POOL_EVM_FEE_RECIPIENT_ROBINHOOD_TESTNET:-}
      POOL_EVM_RPCS_ROBINHOOD_TESTNET: ${POOL_EVM_RPCS_ROBINHOOD_TESTNET:-}
      # POST /v1/pool/evm/sell per network (src/pool/evm.ts POOL_EVM_SELL_ENV): the sell sender's own key (0x + 64 hex,
      # gas only, never the withdraw sender's key); empty: that network's sells answer 503 not_configured
      POOL_EVM_SELL_KEY_BASE: ${POOL_EVM_SELL_KEY_BASE:-}
      POOL_EVM_SELL_KEY_ROBINHOOD: ${POOL_EVM_SELL_KEY_ROBINHOOD:-}
      POOL_EVM_SELL_KEY_BASE_SEPOLIA: ${POOL_EVM_SELL_KEY_BASE_SEPOLIA:-}
      POOL_EVM_SELL_KEY_ROBINHOOD_TESTNET: ${POOL_EVM_SELL_KEY_ROBINHOOD_TESTNET:-}
      # the fee collector each Sell must pay (src/pool/evm.ts POOL_EVM_COLLECTOR_ENV, card helper-sender-fee-proof): its
      # Paid log proves a sale's fee; empty: that network's sells answer 503 not_configured
      POOL_EVM_FEE_COLLECTOR_BASE: ${POOL_EVM_FEE_COLLECTOR_BASE:-}
      POOL_EVM_FEE_COLLECTOR_ROBINHOOD: ${POOL_EVM_FEE_COLLECTOR_ROBINHOOD:-}
      POOL_EVM_FEE_COLLECTOR_BASE_SEPOLIA: ${POOL_EVM_FEE_COLLECTOR_BASE_SEPOLIA:-}
      POOL_EVM_FEE_COLLECTOR_ROBINHOOD_TESTNET: ${POOL_EVM_FEE_COLLECTOR_ROBINHOOD_TESTNET:-}
      HELPER_RELEASE: ${HELPER_RELEASE:-}
      # the relayers' durable store (src/store/durable.ts): the one writable path in a read-only container
      HELPER_STORE_DIR: /app/data
    volumes:
      - helper_data:/app/data
    restart: unless-stopped
    # any stop of the helper lets its drain finish (src/server.ts STOP_MS, 50 s), as redeploy.sh's `docker stop -t 60` does
    stop_grace_period: 60s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]
    # Healthy only when GET /v1/health answers ready: true (src/server.ts listens on 8080 only once the helper is ready).
    # deploy/redeploy.sh starts a new helper beside the running one and stops the old one only after this passes, so the
    # swap has no gap; start_period lets a slow start run without counting its failed checks.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>r.json()).then(j=>process.exit(j.ready===true?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
  caddy:
    # caddy 2.11.6 on Alpine, pinned by its multi-arch index digest (Docker Hub tag API, read 2026-11-01 00:41Z)
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    restart: unless-stopped
    depends_on: [helper]
    environment:
      HELPER_SITE: ${HELPER_SITE:-api.confidential.unrealized.trade}
    ports: ["${HELPER_PORTS_HTTP:-80}:80", "${HELPER_PORTS_HTTPS:-443}:443", "${HELPER_PORTS_HTTPS:-443}:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
volumes:
  caddy_data: {}
  caddy_config: {}
  helper_data: {}
